<script>
/* =============================================================
   HAULXIFY BLOG — FIREBASE EDITION
   Reads articles from Firestore automatically.
   Ranking, trending, view counts all driven by real data.

   TO PUBLISH A NEW ARTICLE:
   1. Write it in blog-admin.html — click Publish
   2. Download the generated HTML file
   3. Upload it to /blog/ folder on GitHub
   4. Request indexing in Google Search Console
   No code changes needed here ever.
   ============================================================= */

if (!firebase.apps.length) {
  firebase.initializeApp({
    apiKey:            "AIzaSyBaRMQBLfDyufJkC4E8XCvzOIMEawOQObw",
    authDomain:        "haulxify-app.firebaseapp.com",
    projectId:         "haulxify-app",
    storageBucket:     "haulxify-app.firebasestorage.app",
    messagingSenderId: "453228026261",
    appId:             "1:453228026261:web:1d66ab1d47418906807e9c"
  });
}
const db = firebase.firestore();

const ICONS = {
  compliance:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`,
  billing:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>`,
  nemt:        `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
  'tow-truck': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.72A2 2 0 012.18 1h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 8.15a16 16 0 006.94 6.94l1.52-1.52a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>`,
  operations:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>`,
  dispatching: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19V6l12-3v13M9 19c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2zm12-3c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2z"/></svg>`,
  trucking:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>`,
  default:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`
};

function formatDate(d) {
  return new Date(d).toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
}
function formatViews(n) {
  if (!n) return '0';
  return n >= 1000 ? (n/1000).toFixed(1)+'k' : String(n);
}
function getIcon(a) { return ICONS[a.category] || ICONS.default; }
function articleUrl(slug) { return 'blog/' + slug + '.html'; }

/* ── Smart ranking algorithm ── */
function rankArticles(articles) {
  const now = Date.now();
  const MS_90_DAYS = 90 * 24 * 60 * 60 * 1000;
  return articles.map(a => {
    const ageMs        = now - new Date(a.date).getTime();
    const recencyScore = Math.max(0, 100 - (ageMs / MS_90_DAYS) * 100);
    const viewScore    = Math.min(a.views || 0, 5000) / 50;
    const weeklyScore  = Math.min(a.weeklyViews || 0, 1000) / 10;
    a._score = (viewScore * 0.35) + (recencyScore * 0.35) + (weeklyScore * 0.30);
    return a;
  }).sort((a, b) => b._score - a._score);
}

function sortArticles(articles, method) {
  const pinned = articles.filter(a => a.featured);
  const rest   = articles.filter(a => !a.featured);
  let sorted;
  if (method === 'newest')       sorted = [...rest].sort((a,b) => new Date(b.date) - new Date(a.date));
  else if (method === 'popular') sorted = [...rest].sort((a,b) => (b.views||0) - (a.views||0));
  else                           sorted = rankArticles([...rest]);
  return [...pinned, ...sorted];
}

/* ── Auto-detect trending (top 3 by weeklyViews) ── */
function markTrending(articles) {
  const sorted = [...articles].sort((a,b) => (b.weeklyViews||0) - (a.weeklyViews||0));
  const topIds = new Set(sorted.slice(0,3).map(a => a.id));
  return articles.map(a => ({ ...a, isTrending: topIds.has(a.id) || a.trending }));
}

/* ── Weekly views auto-reset ── */
async function checkWeeklyReset(articles) {
  const today     = new Date().toISOString().split('T')[0];
  const batch     = db.batch();
  let   needsWrite = false;
  articles.forEach(a => {
    if (!a.weeklyViewsReset) return;
    const diffDays = (Date.now() - new Date(a.weeklyViewsReset).getTime()) / (1000*60*60*24);
    if (diffDays >= 7) {
      batch.update(db.collection('articles').doc(a.id), { weeklyViews: 0, weeklyViewsReset: today });
      a.weeklyViews = 0;
      a.weeklyViewsReset = today;
      needsWrite = true;
    }
  });
  if (needsWrite) { try { await batch.commit(); } catch(e) {} }
  return articles;
}

/* ── State ── */
let allArticles    = [];
let activeCategory = 'all';
let searchQuery    = '';
let sortMethod     = 'smart';

/* ── Render featured ── */
function renderFeatured(article) {
  const hasThumb = article.thumbnail && article.thumbnail.trim() !== '';
  document.getElementById('featured-slot').innerHTML = `
    <a class="blog-featured" href="${articleUrl(article.slug)}">
      <div class="blog-featured-visual">
        ${hasThumb ? `<img src="${article.thumbnail}" alt="${article.title}" loading="lazy"><div class="blog-featured-overlay"></div>` : ''}
        <div class="blog-featured-badge">Editor's Pick</div>
        <div class="blog-featured-icon">${getIcon(article)}</div>
      </div>
      <div class="blog-featured-body">
        <div class="blog-featured-cat">${article.categoryLabel || article.category}</div>
        <div class="blog-featured-title">${article.title}</div>
        <div class="blog-featured-excerpt">${article.excerpt}</div>
        <div class="blog-featured-meta">
          <div class="blog-meta-info">
            <span>${formatDate(article.date)}</span>
            <span>${article.readTime}</span>
            <span>${formatViews(article.views)} reads</span>
          </div>
          <div class="blog-read-btn">Read Article <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></div>
        </div>
      </div>
    </a>`;
}

/* ── Render grid ── */
function renderGrid(articles) {
  const grid = document.getElementById('blog-grid');
  if (!articles.length) { grid.innerHTML = ''; return; }
  grid.innerHTML = articles.map(a => {
    const hasThumb = a.thumbnail && a.thumbnail.trim() !== '';
    return `
    <a class="blog-card" href="${articleUrl(a.slug)}">
      <div class="blog-card-img">
        ${hasThumb ? `<img src="${a.thumbnail}" alt="${a.title}" loading="lazy"><div class="blog-card-overlay"></div>` : ''}
        <div class="blog-card-img-icon">${getIcon(a)}</div>
        ${a.isTrending ? '<div class="blog-trending-badge">Trending</div>' : ''}
      </div>
      <div class="blog-card-body">
        <div class="blog-card-cat">${a.categoryLabel || a.category}</div>
        <div class="blog-card-title">${a.title}</div>
        <div class="blog-card-excerpt">${a.excerpt}</div>
        <div class="blog-card-footer">
          <div class="blog-card-meta">${formatDate(a.date)} · ${a.readTime}</div>
          <div class="blog-card-views">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            ${formatViews(a.views)}
          </div>
        </div>
      </div>
    </a>`;
  }).join('');
}

/* ── Render all ── */
function renderAll() {
  let filtered = allArticles.filter(a => a.status === 'published');
  if (activeCategory !== 'all') filtered = filtered.filter(a => a.category === activeCategory);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(a =>
      a.title.toLowerCase().includes(q) ||
      a.excerpt.toLowerCase().includes(q) ||
      (a.categoryLabel||'').toLowerCase().includes(q)
    );
  }
  const sorted = sortArticles(filtered, sortMethod);
  const empty  = document.getElementById('blog-empty');
  if (!sorted.length) {
    document.getElementById('featured-slot').innerHTML = '';
    renderGrid([]);
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  const [top, ...rest] = sorted;
  renderFeatured(top);
  renderGrid(rest);
}

/* ── Load from Firestore ── */
async function loadArticles() {
  const loading = document.getElementById('blog-loading');
  const error   = document.getElementById('blog-error');
  loading.style.display = 'block';
  error.style.display   = 'none';
  try {
    const snap = await db.collection('articles').where('status','==','published').get();
    let articles = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    articles = await checkWeeklyReset(articles);
    articles = markTrending(articles);
    allArticles = articles;
    loading.style.display = 'none';
    renderAll();
  } catch(err) {
    console.error('Failed to load articles:', err);
    loading.style.display = 'none';
    error.style.display   = 'block';
  }
}

/* ── Controls ── */
document.getElementById('filter-bar').addEventListener('click', e => {
  const btn = e.target.closest('.blog-filter');
  if (!btn) return;
  document.querySelectorAll('.blog-filter').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeCategory = btn.dataset.cat;
  renderAll();
});
document.getElementById('sort-select').addEventListener('change', e => {
  sortMethod = e.target.value;
  renderAll();
});
let searchTimeout;
document.getElementById('search-input').addEventListener('input', e => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => { searchQuery = e.target.value.trim(); renderAll(); }, 250);
});

loadArticles();
</script>
</body>
</html>
