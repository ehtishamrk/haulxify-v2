<script>
/* =============================================================
   HAULXIFY BLOG ENGINE — CLEAN SINGLE SYSTEM
   Each article card links directly to its static HTML file.
   No inline article reader. No Google Sheets. No dual system.

   HOW TO ADD A NEW ARTICLE:
   1. Ask Claude to generate the static HTML file → upload to /blog/
   2. Add the article's metadata entry to ARTICLES array below
   3. Add its slug mapping to SLUGS object below
   4. Done. The card appears automatically ranked by the algorithm.

   HOW TO UPDATE VIEW COUNTS (monthly, ~5 min):
   1. Open Google Analytics → Reports → Pages and screens
   2. Find each article's page views for the past 30 days
   3. Update the `views` number in each article entry below
   ============================================================= */

/* ── Slug map: article id → static HTML filename (no extension) ── */
const SLUGS = {
  'ifta-filing-guide-2025':         'ifta-filing-guide',
  'invoicing-cash-flow-trucking':   'trucking-invoices-cash-flow',
  'nemt-medicaid-denials':          'nemt-medicaid-billing-denials',
  'tow-truck-after-hours-revenue':  'tow-truck-after-hours-revenue',
  'outsource-trucking-back-office': 'outsource-trucking-back-office',
  'load-board-strategy-2025':       'load-board-strategy',
};

/* ── Returns the URL for an article, or null if no static file yet ── */
function articleUrl(id) {
  const slug = SLUGS[id];
  return slug ? 'blog/' + slug + '.html' : null;
}

/* ── Article metadata only — NO content field needed here ──
   Views: update monthly from Google Analytics.
   trending: set true for articles you want to highlight.
   featured: set true on ONE article to always pin it at top
             regardless of algorithm score.                   ── */
const ARTICLES = [
  {
    id: 'ifta-filing-guide-2025',
    title: 'IFTA Filing: The Complete Guide for Owner-Operators and Small Fleets',
    category: 'compliance',
    categoryLabel: 'Compliance',
    date: '2025-01-14',
    readTime: '9 min read',
    views: 1840,
    trending: true,
    featured: false,
    excerpt: 'Every quarter, thousands of trucking operations pay IFTA penalties they didn\'t have to. Here\'s exactly how to file correctly, what mileage records you actually need, and how to avoid the most expensive mistakes.',
  },
  {
    id: 'invoicing-cash-flow-trucking',
    title: 'Why Trucking Invoices Get Paid Late — And the Exact System to Fix It',
    category: 'billing',
    categoryLabel: 'Billing & Cash Flow',
    date: '2025-01-21',
    readTime: '7 min read',
    views: 2310,
    trending: true,
    featured: false,
    excerpt: 'Cash flow is the #1 killer of viable trucking operations. The root cause isn\'t the freight market — it\'s the invoice cycle. Here\'s the system that collapses payment time from 45 days to under 10.',
  },
  {
    id: 'nemt-medicaid-denials',
    title: 'The 6 NEMT Medicaid Billing Denials Killing Your Cash Flow (And How to Prevent Every One)',
    category: 'nemt',
    categoryLabel: 'NEMT',
    date: '2025-01-28',
    readTime: '8 min read',
    views: 1650,
    trending: true,
    featured: false,
    excerpt: 'Medicaid denials are the primary revenue leak for NEMT operators — and most of them are preventable. We break down the six most common denial codes, what triggers each one, and the workflow changes that eliminate them.',
  },
  {
    id: 'tow-truck-after-hours-revenue',
    title: 'The After-Hours Revenue Problem Every Tow Truck Operator Has But Won\'t Admit',
    category: 'tow-truck',
    categoryLabel: 'Tow Truck',
    date: '2025-02-04',
    readTime: '6 min read',
    views: 3120,
    trending: true,
    featured: false,
    excerpt: 'Roadside assistance doesn\'t stop at 6pm. Your competitors\' phones don\'t either. Here\'s the exact revenue model showing what unanswered after-hours calls cost the average tow truck operation every year.',
  },
  {
    id: 'outsource-trucking-back-office',
    title: 'Should You Outsource Your Trucking Back Office? The Honest Cost-Benefit Analysis',
    category: 'operations',
    categoryLabel: 'Operations',
    date: '2025-02-11',
    readTime: '7 min read',
    views: 2780,
    trending: false,
    featured: false,
    excerpt: 'Outsourcing your back office sounds like a cost-cutting move. It\'s actually a strategic one. Here\'s the full financial model, what you actually give up, and what the break-even point looks like for different fleet sizes.',
  },
  {
    id: 'load-board-strategy-2025',
    title: 'Load Board Strategy: How Small Fleets Find Better Freight Than Big Carriers',
    category: 'dispatching',
    categoryLabel: 'Dispatching',
    date: '2025-02-18',
    readTime: '8 min read',
    views: 1920,
    trending: false,
    featured: false,
    excerpt: 'Most owner-operators take the first load they see. Carriers that consistently outperform the market don\'t — they work load boards like a system. Here\'s the strategy, the tools, and the specific moves that improve rate per mile.',
  },
];

/* ── Icons by category ── */
const ICONS = {
  compliance:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`,
  billing:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>`,
  nemt:        `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
  'tow-truck': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.72A2 2 0 012.18 1h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 8.15a16 16 0 006.94 6.94l1.52-1.52a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>`,
  operations:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>`,
  dispatching: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19V6l12-3v13M9 19c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2zm12-3c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2z"/></svg>`,
  trucking:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>`,
  default:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`
};

/* ── Helpers ── */
function formatDate(d) {
  return new Date(d).toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
}
function formatViews(n) {
  return n >= 1000 ? (n/1000).toFixed(1)+'k' : String(n);
}
function getIcon(a) {
  return ICONS[a.category] || ICONS.default;
}

/* ── Ranking algorithm (unchanged from original)
   Score = (views × 0.35) + (recency × 0.35) + (trending × 200 × 0.30)
   Recency score decays over 90 days (most recent = 100, 90 days old = 0) ── */
function rankArticles(articles) {
  const now = Date.now();
  const MS_90_DAYS = 90 * 24 * 60 * 60 * 1000;
  return articles.map(a => {
    const ageMs  = now - new Date(a.date).getTime();
    const recencyScore = Math.max(0, 100 - (ageMs / MS_90_DAYS) * 100);
    const viewScore    = Math.min(a.views || 0, 5000) / 50;
    const trendingBoost = a.trending ? 100 : 0;
    a._score = (viewScore * 0.35) + (recencyScore * 0.35) + (trendingBoost * 0.30);
    return a;
  }).sort((a, b) => b._score - a._score);
}

function sortArticles(articles, method) {
  // A manually featured article always goes to the top slot
  const pinned = articles.find(a => a.featured);
  const rest   = articles.filter(a => !a.featured);
  let sorted;
  if (method === 'newest')  sorted = [...rest].sort((a,b) => new Date(b.date) - new Date(a.date));
  else if (method === 'popular') sorted = [...rest].sort((a,b) => (b.views||0) - (a.views||0));
  else sorted = rankArticles([...rest]);
  return pinned ? [pinned, ...sorted] : sorted;
}

/* ── State ── */
let allArticles   = [...ARTICLES];
let activeCategory = 'all';
let searchQuery   = '';
let sortMethod    = 'smart';

/* ── Render featured slot ── */
function renderFeatured(article) {
  const url  = articleUrl(article.id) || '#';
  const slot = document.getElementById('featured-slot');
  slot.innerHTML = `
    <a class="blog-featured" href="${url}">
      <div class="blog-featured-visual">
        <div class="blog-featured-badge">Editor's Pick</div>
        <div class="blog-featured-icon">${getIcon(article)}</div>
      </div>
      <div class="blog-featured-body">
        <div class="blog-featured-cat">${article.categoryLabel || article.category}</div>
        <div class="blog-featured-title">${article.title}</div>
        <div class="blog-featured-excerpt">${article.excerpt}</div>
        <div class="blog-featured-meta">
          <div class="blog-meta-info">
            <span>${formatDate(article.date)}</span>
            <span>${article.readTime}</span>
            <span>${formatViews(article.views)} reads</span>
          </div>
          <div class="blog-read-btn">Read Article <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></div>
        </div>
      </div>
    </a>
  `;
}

/* ── Render card grid ── */
function renderGrid(articles) {
  const grid = document.getElementById('blog-grid');
  if (!articles.length) { grid.innerHTML = ''; return; }
  grid.innerHTML = articles.map(a => {
    const url = articleUrl(a.id) || '#';
    return `
    <a class="blog-card" href="${url}">
      <div class="blog-card-img">
        <div class="blog-card-img-icon">${getIcon(a)}</div>
        ${a.trending ? '<div class="blog-trending-badge">Trending</div>' : ''}
      </div>
      <div class="blog-card-body">
        <div class="blog-card-cat">${a.categoryLabel || a.category}</div>
        <div class="blog-card-title">${a.title}</div>
        <div class="blog-card-excerpt">${a.excerpt}</div>
        <div class="blog-card-footer">
          <div class="blog-card-meta">${formatDate(a.date)} · ${a.readTime}</div>
          <div class="blog-card-views">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            ${formatViews(a.views)}
          </div>
        </div>
      </div>
    </a>`;
  }).join('');
}

/* ── Render all (filter + sort + display) ── */
function renderAll() {
  let filtered = allArticles;
  if (activeCategory !== 'all') filtered = filtered.filter(a => a.category === activeCategory);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(a =>
      a.title.toLowerCase().includes(q) ||
      a.excerpt.toLowerCase().includes(q) ||
      (a.categoryLabel || '').toLowerCase().includes(q)
    );
  }
  const sorted = sortArticles(filtered, sortMethod);
  const empty  = document.getElementById('blog-empty');

  if (!sorted.length) {
    document.getElementById('featured-slot').innerHTML = '';
    renderGrid([]);
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  const [top, ...rest] = sorted;
  renderFeatured(top);
  renderGrid(rest);
}

/* ── Controls ── */
document.getElementById('filter-bar').addEventListener('click', e => {
  const btn = e.target.closest('.blog-filter');
  if (!btn) return;
  document.querySelectorAll('.blog-filter').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeCategory = btn.dataset.cat;
  renderAll();
});

document.getElementById('sort-select').addEventListener('change', e => {
  sortMethod = e.target.value;
  renderAll();
});

let searchTimeout;
document.getElementById('search-input').addEventListener('input', e => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    searchQuery = e.target.value.trim();
    renderAll();
  }, 250);
});

/* ── Init ── */
renderAll();
</script>
</body>
</html>
