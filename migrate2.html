<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Haulxify — Article Migration 2</title>
  <style>
    body { font-family: monospace; background: #0D1929; color: #fff; padding: 40px; }
    h2 { color: #E87722; }
    #log { margin-top: 24px; line-height: 2; font-size: 14px; }
    .ok   { color: #4ade80; }
    .err  { color: #f87171; }
    .info { color: #93c5fd; }
    button {
      margin-top: 24px;
      background: #E87722;
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 16px;
      font-family: monospace;
      border-radius: 8px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <h2>Haulxify — Article Migration 2</h2>
  <p style="color:rgba(255,255,255,0.6);">
    Adds 4 new articles to Firestore.<br>
    Click the button. When you see 🎉 delete this file from GitHub.
  </p>
  <button id="btn" onclick="runMigration()">Run Migration</button>
  <div id="log"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script>
    firebase.initializeApp({
      apiKey:            "AIzaSyBaRMQBLfDyufJkC4E8XCvzOIMEawOQObw",
      authDomain:        "haulxify-app.firebaseapp.com",
      projectId:         "haulxify-app",
      storageBucket:     "haulxify-app.firebasestorage.app",
      messagingSenderId: "453228026261",
      appId:             "1:453228026261:web:1d66ab1d47418906807e9c"
    });

    const db = firebase.firestore();

    function log(msg, type='info') {
      const div = document.getElementById('log');
      const line = document.createElement('div');
      line.className = type;
      line.textContent = msg;
      div.appendChild(line);
    }

    async function runMigration() {
      const btn = document.getElementById('btn');
      btn.disabled = true;
      btn.textContent = 'Running…';

      const articles = [
        {
          id: 'ifta-reporting-step-by-step',
          slug: 'ifta-reporting-step-by-step',
          title: 'How to Do IFTA Reporting Step by Step',
          category: 'compliance',
          categoryLabel: 'Compliance',
          date: '2025-03-04',
          readTime: '10 min read',
          views: 0,
          weeklyViews: 0,
          weeklyViewsReset: '2026-04-20',
          trending: false,
          featured: false,
          excerpt: 'IFTA filing done wrong costs thousands in penalties. This step-by-step guide covers mileage records, fuel receipts, tax calculation, filing deadlines and the 5 mistakes that trigger audits.',
          thumbnail: '',
          status: 'published'
        },
        {
          id: 'dot-compliance-checklist-small-trucking',
          slug: 'dot-compliance-checklist-small-trucking',
          title: 'DOT Compliance Checklist for Small Trucking Companies',
          category: 'compliance',
          categoryLabel: 'Compliance',
          date: '2025-03-11',
          readTime: '11 min read',
          views: 0,
          weeklyViews: 0,
          weeklyViewsReset: '2026-04-20',
          trending: false,
          featured: false,
          excerpt: 'The complete DOT compliance checklist for small fleets and owner-operators. Driver qualification files, HOS rules, drug testing, insurance requirements and your monthly review routine.',
          thumbnail: '',
          status: 'published'
        },
        {
          id: 'how-much-does-truck-dispatch-service-cost',
          slug: 'how-much-does-truck-dispatch-service-cost',
          title: 'How Much Does Truck Dispatch Service Cost? (Complete Pricing Breakdown)',
          category: 'operations',
          categoryLabel: 'Operations',
          date: '2025-03-18',
          readTime: '9 min read',
          views: 0,
          weeklyViews: 0,
          weeklyViewsReset: '2026-04-20',
          trending: false,
          featured: false,
          excerpt: 'Percentage of revenue, flat rate per load, or per vehicle per day — a full breakdown of every truck dispatch pricing model, hidden costs to watch for, and what a 5-truck fleet actually pays.',
          thumbnail: '',
          status: 'published'
        },
        {
          id: 'tow-truck-motor-club-billing-guide',
          slug: 'tow-truck-motor-club-billing-guide',
          title: 'Tow Truck Motor Club Billing Guide — AAA, Agero and More',
          category: 'tow-truck',
          categoryLabel: 'Tow Truck',
          date: '2025-03-25',
          readTime: '10 min read',
          views: 0,
          weeklyViews: 0,
          weeklyViewsReset: '2026-04-20',
          trending: false,
          featured: false,
          excerpt: 'How to bill AAA, Agero, Urgently and HONK correctly every time. Covers documentation requirements, accessorial charges most operators miss, common denial reasons and how to build a billing system that pays.',
          thumbnail: '',
          status: 'published'
        }
      ];

      log('🚀 Starting migration of ' + articles.length + ' articles...', 'info');

      let success = 0;
      let failed  = 0;

      for (const article of articles) {
        try {
          const { id, ...data } = article;
          await db.collection('articles').doc(id).set(data);
          log('✅  Added: ' + article.title, 'ok');
          success++;
        } catch (err) {
          log('❌  Failed: ' + article.title + ' — ' + err.message, 'err');
          failed++;
        }
      }

      if (failed === 0) {
        log('', 'info');
        log('🎉  All ' + success + ' articles added successfully!', 'ok');
        log('', 'info');
        log('✅  Delete this file (migrate2.html) from your GitHub repo now.', 'info');
        btn.textContent = '✓ Migration Complete';
        btn.style.background = '#16a34a';
      } else {
        log('⚠️  Migration completed with ' + failed + ' error(s).', 'err');
        btn.textContent = 'Had errors — check above';
        btn.style.background = '#dc2626';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
