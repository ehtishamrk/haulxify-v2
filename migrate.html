<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Haulxify — Article Migration</title>
  <style>
    body { font-family: monospace; background: #0D1929; color: #fff; padding: 40px; }
    h2 { color: #E87722; }
    #log { margin-top: 24px; line-height: 2; font-size: 14px; }
    .ok  { color: #4ade80; }
    .err { color: #f87171; }
    .info { color: #93c5fd; }
    button {
      margin-top: 24px;
      background: #E87722;
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 16px;

      border-radius: 8px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

<body>
  <h2>Haulxify — One-Time Article Migration</h2>
  <p style="color:rgba(255,255,255,0.6);">
    This page migrates your 6 existing articles into Firestore.<br>
    Click the button below. When you see 🎉 delete this file from GitHub.
  </p>
  <button id="btn" onclick="runMigration()">Run Migration</button>
  <div id="log"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script>
    // Your Firebase config
    firebase.initializeApp({
      apiKey:            "AIzaSyBaRMQBLfDyufJkC4E8XCvzOIMEawOQObw",
      authDomain:        "haulxify-app.firebaseapp.com",
      projectId:         "haulxify-app",
      storageBucket:     "haulxify-app.firebasestorage.app",
      messagingSenderId: "453228026261",
      appId:             "1:453228026261:web:1d66ab1d47418906807e9c"
    });

    const db = firebase.firestore();

    function log(msg, type='info') {
      const div = document.getElementById('log');
      const line = document.createElement('div');
      line.className = type;
      line.textContent = msg;
      div.appendChild(line);
    }

    async function runMigration() {
      const btn = document.getElementById('btn');
      btn.disabled = true;
      btn.textContent = 'Running…';

      const articles = [
        {
          id: 'ifta-filing-guide-2025',
          slug: 'ifta-filing-guide',
          title: 'IFTA Filing: The Complete Guide for Owner-Operators and Small Fleets',
          category: 'compliance',
          categoryLabel: 'Compliance',
          date: '2025-01-14',
          readTime: '9 min read',
          views: 1840,
          weeklyViews: 0,
          weeklyViewsReset: '2026-04-14',
          trending: true,
          featured: false,
          excerpt: 'Every quarter, thousands of trucking operations pay IFTA penalties they didn\'t have to. Here\'s exactly how to file correctly, what mileage records you actually need, and how to avoid the most expensive mistakes.',
          thumbnail: '',
          status: 'published'
        },
        {
          id: 'invoicing-cash-flow-trucking',
          slug: 'trucking-invoices-cash-flow',
          title: 'Why Trucking Invoices Get Paid Late — And the Exact System to Fix It',
          category: 'billing',
          categoryLabel: 'Billing & Cash Flow',
          date: '2025-01-21',
          readTime: '7 min read',
          views: 2310,
          weeklyViews: 0,
          weeklyViewsReset: '2026-04-14',
          trending: true,
          featured: false,
          excerpt: 'Cash flow is the #1 killer of viable trucking operations. The root cause isn\'t the freight market — it\'s the invoice cycle. Here\'s the system that collapses payment time from 45 days to under 10.',
          thumbnail: '',
          status: 'published'
        },
        {
          id: 'nemt-medicaid-denials',
          slug: 'nemt-medicaid-billing-denials',
          title: 'The 6 NEMT Medicaid Billing Denials Killing Your Cash Flow (And How to Prevent Every One)',
          category: 'nemt',
          categoryLabel: 'NEMT',
          date: '2025-01-28',
          readTime: '8 min read',
          views: 1650,
          weeklyViews: 0,
          weeklyViewsReset: '2026-04-14',
          trending: true,
          featured: false,
          excerpt: 'Medicaid denials are the primary revenue leak for NEMT operators — and most of them are preventable. We break down the six most common denial codes, what triggers each one, and the workflow changes that eliminate them.',
          thumbnail: '',
          status: 'published'
        },
        {
          id: 'tow-truck-after-hours-revenue',
          slug: 'tow-truck-after-hours-revenue',
          title: 'The After-Hours Revenue Problem Every Tow Truck Operator Has But Won\'t Admit',
          category: 'tow-truck',
          categoryLabel: 'Tow Truck',
          date: '2025-02-04',
          readTime: '6 min read',
          views: 3120,
          weeklyViews: 0,
          weeklyViewsReset: '2026-04-14',
          trending: true,
          featured: false,
          excerpt: 'Roadside assistance doesn\'t stop at 6pm. Your competitors\'s phones don\'t either. Here\'s the exact revenue model showing what unanswered after-hours calls cost the average tow truck operation every year.',
          thumbnail: '',
          status: 'published'
        },
        {
          id: 'outsource-trucking-back-office',
          slug: 'outsource-trucking-back-office',
          title: 'Should You Outsource Your Trucking Back Office? The Honest Cost-Benefit Analysis',
          category: 'operations',
          categoryLabel: 'Operations',
          date: '2025-02-11',
          readTime: '7 min read',
          views: 2780,
          weeklyViews: 0,
          weeklyViewsReset: '2026-04-14',
          trending: false,
          featured: false,
          excerpt: 'Outsourcing your back office sounds like a cost-cutting move. It\'s actually a strategic one. Here\'s the full financial model, what you actually give up, and what the break-even point looks like for different fleet sizes.',
          thumbnail: '',
          status: 'published'
        },
        {
          id: 'load-board-strategy-2025',
          slug: 'load-board-strategy',
          title: 'Load Board Strategy: How Small Fleets Find Better Freight Than Big Carriers',
          category: 'dispatching',
          categoryLabel: 'Dispatching',
          date: '2025-02-18',
          readTime: '8 min read',
          views: 1920,
          weeklyViews: 0,
          weeklyViewsReset: '2026-04-14',
          trending: false,
          featured: false,
          excerpt: 'Most owner-operators take the first load they see. Carriers that consistently outperform the market don\'t — they work load boards like a system. Here\'s the strategy and specific moves that improve rate per mile.',
          thumbnail: '',
          status: 'published'
        }
      ];

      log('🚀 Starting migration of ' + articles.length + ' articles...', 'info');

      let success = 0;
      let failed  = 0;

      for (const article of articles) {
        try {
          const { id, ...data } = article;
          await db.collection('articles').doc(id).set(data);
          log('✅  Migrated: ' + article.title, 'ok');
          success++;
        } catch (err) {
          log('❌  Failed: ' + article.title + ' — ' + err.message, 'err');
          failed++;
        }
      }

      if (failed === 0) {
        log('', 'info');
        log('🎉  All ' + success + ' articles migrated successfully!', 'ok');
        log('', 'info');
        log('✅  You can now delete this file (migrate.html) from your GitHub repo.', 'info');
        btn.textContent = '✓ Migration Complete';
        btn.style.background = '#16a34a';
      } else {
        log('⚠️  Migration completed with ' + failed + ' error(s). Check above for details.', 'err');
        btn.textContent = 'Migration had errors';
        btn.style.background = '#dc2626';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
